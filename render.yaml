# One-step hosting on Render: this file creates the web app AND its database.
# You are only asked for the two keys marked "sync: false".
databases:
  - name: outerjoin-db
    plan: free

services:
  - type: web
    name: outerjoin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: DATABASE_URL
        fromDatabase:
          name: outerjoin-db
          property: connectionString
      - key: NIMBLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# One-click hosting on Render. Each key marked "sync: false" is asked for in a form at deploy time.
services:
  - type: web
    name: outerjoin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: DATABASE_URL
        sync: false
      - key: NIMBLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
